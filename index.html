<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SoftBody Drive 2D</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
</head>
<body>
<canvas id="game"></canvas>

<!-- Компактный HUD -->
<div id="hud">
  <span id="speed"><b id="speedVal">0</b> км/ч</span>
  <span class="bar"><i id="dmgBar"></i></span>
  <span id="dmgVal">100%</span>
  <span>📏 <b id="dist">0</b> м</span>
  <span>🏆 <b id="best">0</b> м</span>
  <span id="wheelState">🛞 2/2</span>
  <span id="seed"></span>
</div>
<div id="msg"></div>

<div id="topBtns">
  <button id="btnPause" title="Пауза (P)">⏸</button>
  <button id="btnReset" title="Починить (R)">🔧</button>
</div>

<div id="hint"><kbd>W</kbd> газ · <kbd>S</kbd> тормоз · <kbd>A</kbd>/<kbd>D</kbd> наклон · <kbd>Shift</kbd> нитро · <kbd>R</kbd> ремонт</div>
<div id="banner">🚗 жми <b>W</b> — поехали!</div>
<div id="paused">⏸ Пауза<br><small>P — продолжить</small></div>

<!-- Сенсорное управление -->
<div id="touch">
  <div class="tgroup">
    <button class="tbtn" data-k="tiltL">⟲</button>
    <button class="tbtn" data-k="tiltR">⟳</button>
  </div>
  <div class="tgroup">
    <button class="tbtn" data-k="nitro">🔥</button>
    <button class="tbtn" data-k="brake">S</button>
    <button class="tbtn big" data-k="gas">W</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
